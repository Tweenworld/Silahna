[project]
name = "silahna"
version = "0.1.0"
description = "Consent-first couple results and counselling linkage. Synthetic data only."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.1",
    "cryptography==44.0.1",
    "fastapi==0.115.6",
    "itsdangerous==2.2.0",
    "jsonschema==4.23.0",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "pyyaml==6.0.2",
    "sqlalchemy==2.0.36",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "bandit==1.8.3",
    "httpx==0.28.1",
    "hypothesis==6.122.3",
    "mypy==1.14.0",
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine", "src/config", "src/referral", "src/audit", "src/db"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["engine", "config", "referral", "audit", "db"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
